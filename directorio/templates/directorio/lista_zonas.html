{% extends 'directorio/base.html' %}
{% block title %}Zonas - EnTuBarrio{% endblock %}
{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Explorar por Zonas</h1>
    <div class="row g-4">
        {% for zona in zonas %}
        <div class="col-md-4 col-lg-3">
            <a href="{% url 'directorio:locales_por_zona' zona.id %}" class="text-decoration-none">
                <div class="card text-center p-4 h-100 card-local">
                    <h4 class="mb-2">{{ zona.nombre }}</h4>
                    <p class="text-muted mb-0">{{ zona.total_locales }} locales</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
