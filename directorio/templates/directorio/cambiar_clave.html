{% extends 'directorio/base.html' %}
{% block title %}Cambiar Contraseña - EnTuBarrio{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-4">Cambiar Contraseña</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Actualizar Clave</button>
                </form>
                <p class="text-center mt-3">
                    <a href="{% url 'directorio:mi_panel' %}">Volver al Panel</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
