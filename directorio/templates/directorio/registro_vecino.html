{% extends 'directorio/base.html' %}
{% block title %}Registro - EnTuBarrio{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-4">Crear Cuenta de Vecino</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Registrarme</button>
                </form>
                <p class="text-center mt-3">
                    ¿Ya tienes cuenta? <a href="{% url 'directorio:login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
